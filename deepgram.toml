[meta]
title = "Flask Flux Text-to-Speech"
description = "Get started using Deepgram's Flux streaming text-to-speech (v2 speak) with this Flask demo app"
author = "Deepgram DX Team <devrel@deepgram.com> (https://developers.deepgram.com)"
repository = "https://github.com/deepgram-starters/flask-flux-tts"
useCase = "flux-text-to-speech"
language = "python"
framework = "flask"
sdk = "deepgram-sdk"
tags = ["flux", "text-to-speech", "tts", "streaming-tts", "real-time", "speak-v2", "python", "flask"]

[check]
command = ["git --version", "python3 --version"]
message = "Prerequisites checked"

[install.pre]
command = "git submodule update --init --recursive"
message = "Submodules initialized"

[install]
command = ["pip install -r requirements.txt", "cd frontend && corepack pnpm install"]
message = "Dependencies installed"

[install.config]
sample = "sample.env"
output = ".env"

[start.pre]
command = ["test -f .env || (echo '.env not found. Run: cp sample.env .env' && exit 1)", "test -d frontend/.git || echo 'Error: Frontend submodule not initialized'"]
message = "Pre-flight checks complete"

[start]
command = ["python3 app.py", "cd frontend && pnpm run dev -- --port 8080 --no-open"]
parallel = true
message = "Application running on http://localhost:8080"

[update]
command = "git submodule update --remote --merge"
message = "Submodules updated"

[clean]
command = ["rm -rf __pycache__", "rm -rf frontend/node_modules", "rm -rf frontend/.vite"]
message = "Build artifacts cleaned"

# Eject frontend and contracts submodules for standalone development
[eject-frontend]
command = "make eject-frontend"
message = "Frontend ejected successfully"

[test]
command = "cd contracts && ./tests/run-flux-tts-app.sh"
message = "Contract conformance tests"
